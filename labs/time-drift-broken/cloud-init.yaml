#cloud-config
packages:
  - chrony
  - openssl
  - gzip
runcmd:
  - mkdir -p /srv/time-repo/dists/stable/main/binary-amd64
  - touch /srv/time-repo/dists/stable/main/binary-amd64/Packages
  - gzip -n -f /srv/time-repo/dists/stable/main/binary-amd64/Packages
  - |
    repo=/srv/time-repo
    pkg="$repo/dists/stable/main/binary-amd64/Packages.gz"
    size=$(stat -c%s "$pkg")
    md5=$(md5sum "$pkg" | awk '{print $1}')
    sha256=$(sha256sum "$pkg" | awk '{print $1}')
    cat > "$repo/dists/stable/Release" <<EOF
    Origin: BrokenOps
    Label: BrokenOps
    Suite: stable
    Codename: stable
    Date: $(date -u '+%a, %d %b %Y %H:%M:%S +0000')
    Architectures: amd64
    Components: main
    Description: BrokenOps local apt repository
    MD5Sum:
     $md5 $size main/binary-amd64/Packages.gz
    SHA256:
     $sha256 $size main/binary-amd64/Packages.gz
    EOF
  - mkdir -p /etc/time-lab/certs
  - |
    cat > /etc/time-lab/certs/openssl.cnf <<'EOF'
    [req]
    default_bits = 2048
    prompt = no
    default_md = sha256
    distinguished_name = dn
    x509_extensions = v3_req

    [dn]
    CN = 127.0.0.1

    [v3_req]
    subjectAltName = @alt_names

    [alt_names]
    DNS.1 = localhost
    IP.1 = 127.0.0.1
    EOF
  - openssl req -x509 -nodes -newkey rsa:2048 -days 365 -keyout /etc/time-lab/certs/server.key -out /etc/time-lab/certs/server.crt -config /etc/time-lab/certs/openssl.cnf
  - cp /etc/time-lab/certs/server.crt /usr/local/share/ca-certificates/time-repo.crt
  - update-ca-certificates
  - |
    cat > /etc/systemd/system/time-repo.service <<'EOF'
    [Unit]
    Description=BrokenOps local HTTPS apt mirror
    After=network.target

    [Service]
    WorkingDirectory=/srv/time-repo
    ExecStart=/usr/bin/openssl s_server -quiet -accept 8443 -cert /etc/time-lab/certs/server.crt -key /etc/time-lab/certs/server.key -WWW
    Restart=always

    [Install]
    WantedBy=multi-user.target
    EOF
  - systemctl daemon-reload
  - systemctl enable --now time-repo.service
  - |
    cat > /etc/apt/sources.list.d/time-repo.list <<'EOF'
    deb [trusted=yes] https://127.0.0.1:8443 stable main
    EOF
  - systemctl disable --now chrony || true
  - timedatectl set-ntp false || true
  - date -u -s "$(date -u -d '2 days ago' '+%Y-%m-%d %H:%M:%S')"
